<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Мой первый тестовый сайт — простое начало для новых идей.">
  <title>Мой первый тестовый сайт</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 24px;
      place-items: center;
      padding: 24px;
      background: #f3f5f9;
      color: #182238;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      max-width: 640px;
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid #e2e7ef;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 48px rgb(24 34 56 / 6%);
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.15;
      letter-spacing: -0.035em;
      overflow-wrap: break-word;
    }

    p {
      margin: 0 0 32px;
      color: #526078;
      font-size: 18px;
      line-height: 1.65;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 24px;
      border-radius: 12px;
      background: #2458cf;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      text-decoration: none;
    }

    .button:hover { background: #1b46aa; }
    .button:focus-visible { outline: 3px solid #182238; outline-offset: 4px; }

    footer {
      color: #526078;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Мой первый тестовый сайт</h1>
    <p>Всё начинается с простой идеи. Эта страница — первый шаг к тому, чтобы превратить её в&nbsp;что-то полезное.</p>
    <a class="button" href="./">На главную</a>
  </main>
  <footer>Тестовый проект 2026</footer>
</body>
</html>
